#region LoginPage
LoginPage.LoginInput=name=email
LoginPage.PasswordInput=name=password
LoginPage.LoginButton=name=login
#endregion

#region LoginResultPage
LoginResultPage.SuccessLoggingOnMessage=cssSelector=div.notice.success
LoginResultPage.SuccessLogOutMessage=cssSelector=div.notice.success
LoginResultPage.ErrorMessage=cssSelector=div.notice.errors
#endregion

#region LogOutPage
LogOutPage.LogOutLink=cssSelector=div#box-account li a
#endregion

#region CartPage
CartPage.Cart=id=cart
#endregion

#region CheckoutPage
CheckoutPage.CartWithGoods=cssSelector=div#box-checkout-customer h2[class='title']
CheckoutPage.CartEmpty=cssSelector=div#checkout-cart-wrapper
CheckoutPage.CartEmptyMessage=cssSelector=div#checkout-cart-wrapper em
#endregion

#region ProductListPage
ProductListPage.ProductItem=cssSelector=div#box-most-popular li a
ProductListPage.RibbonSale=cssSelector=div#box-campaigns div[class='sticker sale']
#endregion

#region ProductDetailPage
ProductDetailPage.AddToCartButton=cssSelector=div#box-product button[name='add_cart_product']
ProductDetailPage.CartItemsQuantity=cssSelector=div#cart span[class='quantity']
#endregion